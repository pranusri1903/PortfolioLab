services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portfoliolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfoliolab}
      POSTGRES_DB: portfoliolab
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfoliolab"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://portfoliolab:${POSTGRES_PASSWORD:-portfoliolab}@db:5432/portfoliolab
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
